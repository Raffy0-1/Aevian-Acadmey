<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D67458"/>
      <stop offset="100%" stop-color="#B8563A"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Icon Tile (Bright Warm Cream with high visibility border) -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#bgGrad)" stroke="#D8CEBF" stroke-width="10"/>

  <!-- Geometric Continuous 'A' Brand Icon -->
  <g>
    <!-- Left Loop Stem - Deep Slate Navy (#1C2A38) -->
    <path
      d="M 256 85 
         C 210 85, 100 245, 85 360 
         C 70 430, 155 465, 210 405 
         L 280 305 
         C 310 265, 260 205, 220 245 
         L 170 305"
      fill="none"
      stroke="#1C2A38"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Right Leg & Intersecting Loop - Terracotta Rust (#C86D51) -->
    <path
      d="M 235 150 
         L 395 390 
         C 415 420, 455 430, 475 430"
      fill="none"
      stroke="url(#copperGrad)"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Crossbar Accent Line -->
    <path
      d="M 160 325 
         L 350 325"
      fill="none"
      stroke="url(#copperGrad)"
      stroke-width="46"
      stroke-linecap="round"
    />
  </g>
</svg>